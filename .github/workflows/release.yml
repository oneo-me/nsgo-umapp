name: Release

# Publishes a GitHub release when a version tag is pushed. A maintainer sets apps/umapp/nsgo.yaml's version, turns CHANGELOG.md's `## [Unreleased]` into `## [X.Y.Z] - YYYY-MM-DD` above a fresh `## [Unreleased]`, merges that to main, then pushes the tag vX.Y.Z on main's commit. This workflow refuses a tag that is not on main, does not match apps/umapp/nsgo.yaml or has no changelog section, builds the macOS app against the NSGo commit apps/umapp/go.mod pins, signs the installers with the NSGO_UPDATES_KEY secret for the appcasts, and publishes the section as the release's notes.
#
# Assets upload one at a time: the install scripts of the systems the release has installers for, each installer followed by its checksum, then the appcasts the apps check for updates. The release page lists them by name whatever the order.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out Umapp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nsgo-umapp
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        id: version
        working-directory: nsgo-umapp
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          declared=$(sed -n 's/^version:[[:space:]]*//p' apps/umapp/nsgo.yaml | tr -d "\"'[:space:]")
          if [ "$declared" != "$version" ]; then
            echo "::error::apps/umapp/nsgo.yaml's version is $declared, not $version. Set it on main before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract the changelog section
        working-directory: nsgo-umapp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The section runs from its heading to the next version's heading, without either.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with notes. Add it on main before tagging."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: nsgo-umapp/apps/umapp/go.mod
          cache: false
      - name: Build
        working-directory: nsgo-umapp/apps/umapp
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NSGO_UPDATES_KEY" ]; then
            echo "::error::Set the NSGO_UPDATES_KEY secret to the secret key of apps/umapp/nsgo.yaml's updates.key, which signs the appcasts."
            exit 1
          fi
          go tool nsgo build -target macos_arm64
      - name: Publish the release
        working-directory: nsgo-umapp/apps/umapp/dist/releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # An install script goes up only with an installer it installs: install.sh for macOS and Linux, install.ps1 for Windows.
          scripts=()
          installers=()
          for file in *; do
            case "$file" in
              install.* | *.sha256 | appcast-*.xml) ;;
              *) [ -f "$file" ] && installers+=("$file" "$file.sha256") ;;
            esac
          done
          if compgen -G '*-macos-*' > /dev/null || compgen -G '*-linux-*' > /dev/null; then scripts+=(install.sh); fi
          if compgen -G '*-windows-*' > /dev/null; then scripts+=(install.ps1); fi
          assets=(${scripts[@]+"${scripts[@]}"} "${installers[@]}")
          assets+=(appcast-*.xml)
          for file in "${assets[@]}"; do
            [ -f "$file" ] || { echo "::error::apps/umapp/dist/releases has no $file."; exit 1; }
          done
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          # A draft until every asset is up, so releases/latest never lacks the install scripts or appcasts.
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --prerelease="$prerelease" --title "Umapp $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          for file in "${assets[@]}"; do
            gh release upload "$GITHUB_REF_NAME" "$file"
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
